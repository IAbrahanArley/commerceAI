spring:
  application:
    name: commerce-ai-api
  ai:
    retry:
      max-attempts: 1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          max-output-tokens: 1024

commerce:
  ai:
    request-timeout-ms: ${GEMINI_TIMEOUT_MS:60000}

server:
  error:
    include-message: never
    include-stacktrace: never
